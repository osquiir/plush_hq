{% extends "base.html" %}

{% block content %}

<div class="mb-4">

    <a
        href="{{ url_for('artists.artists') }}"
        class="text-decoration-none text-secondary"
    >
        ← Back to Artists
    </a>

    <h1 class="mt-3 mb-1">
        New Artist
    </h1>

    <p class="text-muted">
        Create a new artist profile.
    </p>

</div>


{% with messages = get_flashed_messages(with_categories=true) %}

    {% for category, message in messages %}

        <div class="alert alert-{{ category }}">
            {{ message }}
        </div>

    {% endfor %}

{% endwith %}


<div class="card border-0 shadow-sm">

    <div class="card-body p-4">

        <form
            method="POST"
            enctype="multipart/form-data"
        >

            <div class="row g-3">


                <div class="col-md-6">

                    <label class="form-label">
                        Artist Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        required
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Genre
                    </label>

                    <input
                        type="text"
                        name="genre"
                        class="form-control"
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Artist Image
                    </label>

                    <input
                        type="file"
                        name="artist_image"
                        class="form-control"
                        accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
                    >

                    <div class="form-text">
                        JPG, PNG, or WEBP.
                    </div>

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Instagram
                    </label>

                    <input
                        type="url"
                        name="instagram_url"
                        class="form-control"
                        placeholder="https://instagram.com/..."
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        Spotify
                    </label>

                    <input
                        type="url"
                        name="spotify_url"
                        class="form-control"
                        placeholder="https://open.spotify.com/artist/..."
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        TikTok
                    </label>

                    <input
                        type="url"
                        name="tiktok_url"
                        class="form-control"
                        placeholder="https://tiktok.com/@..."
                    >

                </div>


                <div class="col-md-6">

                    <label class="form-label">
                        YouTube
                    </label>

                    <input
                        type="url"
                        name="youtube_url"
                        class="form-control"
                        placeholder="https://youtube.com/@..."
                    >

                </div>

            </div>


            <div class="d-flex justify-content-end gap-2 mt-4">

                <a
                    href="{{ url_for('artists.artists') }}"
                    class="btn btn-outline-secondary"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-dark"
                >
                    Create Artist
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
