<div class="row g-3">

    <div class="col-md-4">
        <div class="border rounded p-3 h-100">
            <p class="text-muted mb-1">Artist</p>
            <h5 class="mb-0">{{ release.artist }}</h5>
        </div>
    </div>

    <div class="col-md-4">
        <div class="border rounded p-3 h-100">
            <p class="text-muted mb-1">Release Type</p>
            <h5 class="mb-0">{{ release.type }}</h5>
        </div>
    </div>

    <div class="col-md-4">
        <div class="border rounded p-3 h-100">
            <p class="text-muted mb-1">Release Date</p>
            <h5 class="mb-0">{{ release.release_date }}</h5>
        </div>
    </div>

    <div class="col-md-4">
        <div class="border rounded p-3 h-100">
            <p class="text-muted mb-1">Budget</p>
            <h5 class="mb-0">${{ release.budget }}</h5>
        </div>
    </div>

    <div class="col-md-4">
        <div class="border rounded p-3 h-100">
            <p class="text-muted mb-1">Current Stage</p>
            <h5 class="mb-0">{{ release.stage }}</h5>
        </div>
    </div>

    <div class="col-md-4">
        <div class="border rounded p-3 h-100">
            <p class="text-muted mb-1">Status</p>
            <h5 class="mb-0">{{ release.status }}</h5>
        </div>
    </div>

</div>
