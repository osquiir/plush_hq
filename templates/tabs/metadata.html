<h4 class="mb-4">Song Metadata</h4>

<div class="row g-3">

    <div class="col-md-6">
        <label class="form-label">Song Title</label>
        <input
            type="text"
            class="form-control"
            value="{{ release.title }}"
            disabled>
    </div>

    <div class="col-md-6">
        <label class="form-label">Artist</label>
        <input
            type="text"
            class="form-control"
            value="{{ release.artist }}"
            disabled>
    </div>

    <div class="col-md-6">
        <label class="form-label">ISRC</label>
        <input
            type="text"
            class="form-control"
            placeholder="Not added yet"
            disabled>
    </div>

    <div class="col-md-6">
        <label class="form-label">UPC</label>
        <input
            type="text"
            class="form-control"
            placeholder="Not added yet"
            disabled>
    </div>

    <div class="col-md-6">
        <label class="form-label">Writers</label>
        <input
            type="text"
            class="form-control"
            placeholder="Not added yet"
            disabled>
    </div>

    <div class="col-md-6">
        <label class="form-label">Producers</label>
        <input
            type="text"
            class="form-control"
            placeholder="Not added yet"
            disabled>
    </div>

    <div class="col-12">
        <label class="form-label">Lyrics</label>
        <textarea
            class="form-control"
            rows="6"
            placeholder="Lyrics have not been added yet"
            disabled></textarea>
    </div>

</div>
